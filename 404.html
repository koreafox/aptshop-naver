<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Load the existing brand font without blocking the first render. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300..700&amp;display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300..700&amp;display=swap"></noscript>

    <title>페이지를 찾을 수 없습니다 (404) | 아파트샵 - 황소밴드 공식 판매점</title>
    <meta name="description" content="요청하신 페이지를 찾을 수 없습니다. 황소밴드 공식 판매점 아파트샵 홈으로 이동해 주세요.">

    <!-- 404 페이지는 색인하지 않도록 명시 -->
    <meta name="robots" content="noindex, follow">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon/favicon-16x16.png">

    <style>
        .pt-20{padding-top:5rem}
        body{font-family:system-ui,-apple-system,sans-serif}
    </style>

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="/css/tailwind-output.css">
    <link rel="stylesheet" href="/css/main.css" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="/css/responsive.css" media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="/css/main.css">
        <link rel="stylesheet" href="/css/responsive.css">
    </noscript>
</head>
<body class="pt-20 bg-gray-50">
    <!-- Header -->
    <div id="header-container"></div>

    <!-- 404 Content -->
    <main class="min-h-[70vh] flex items-center justify-center px-4 py-16">
        <div class="text-center max-w-xl">
            <p class="text-7xl md:text-8xl font-extrabold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">404</p>
            <h1 class="mt-6 text-2xl md:text-3xl font-bold text-gray-900">페이지를 찾을 수 없습니다</h1>
            <p class="mt-4 text-gray-600 leading-relaxed">
                요청하신 페이지가 삭제되었거나 주소가 변경되었을 수 있습니다.<br>
                아래 버튼을 눌러 홈으로 이동해 주세요.
            </p>
            <div class="mt-8 flex flex-col sm:flex-row gap-3 justify-center">
                <a href="/" class="bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700 transition-colors">
                    홈으로 가기
                </a>
                <a href="/menu/products.html" class="bg-white border border-blue-600 text-blue-600 px-6 py-3 rounded-lg font-semibold hover:bg-blue-50 transition-colors">
                    제품 보러가기
                </a>
            </div>
            <p class="mt-10 text-sm text-gray-500">
                도움이 필요하시면 <a href="tel:010-7357-8613" class="text-blue-600 font-medium hover:underline">☎ 010-7357-8613</a> 으로 문의해 주세요.
            </p>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer-container"></div>

    <!-- Terms Modal -->
    <div id="terms-modal" role="dialog" aria-modal="true" aria-labelledby="terms-title" class="hidden fixed inset-0 bg-black bg-opacity-75 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg max-w-4xl w-full max-h-[90vh] overflow-hidden">
            <div class="flex justify-between items-center p-6 border-b">
                <h2 id="terms-title" class="text-2xl font-bold text-gray-900">이용약관</h2>
                <button type="button" onclick="closeTermsModal()" class="text-gray-500 hover:text-gray-700" aria-label="이용약관 닫기">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <div id="terms-content" class="p-6 overflow-y-auto max-h-[calc(90vh-120px)] text-sm text-gray-700 leading-relaxed"></div>
        </div>
    </div>

    <!-- Privacy Modal -->
    <div id="privacy-modal" role="dialog" aria-modal="true" aria-labelledby="privacy-title" class="hidden fixed inset-0 bg-black bg-opacity-75 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg max-w-4xl w-full max-h-[90vh] overflow-hidden">
            <div class="flex justify-between items-center p-6 border-b">
                <h2 id="privacy-title" class="text-2xl font-bold text-gray-900">개인정보처리방침</h2>
                <button type="button" onclick="closePrivacyModal()" class="text-gray-500 hover:text-gray-700" aria-label="개인정보처리방침 닫기">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <div id="privacy-content" class="p-6 overflow-y-auto max-h-[calc(90vh-120px)] text-sm text-gray-700 leading-relaxed"></div>
        </div>
    </div>

    <script src="/js/main.js"></script>
    <script src="/js/terms.js"></script>
</body>
</html>
